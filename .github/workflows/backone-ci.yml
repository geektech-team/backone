name: BackOne CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'playground/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/backone-ci.yml'
  pull_request:
    paths:
      - 'packages/**'
      - 'playground/**'
      - 'package.json'
      - 'bun.lock'

concurrency:
  group: backone-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Typecheck
        run: |
          bunx tsc --project packages/backone/tsconfig.build.json
          bunx tsc --project packages/backone-utils/tsconfig.build.json
          bunx tsc --project packages/backone-cli/tsconfig.build.json

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Pack check
        run: |
          bun pm pack --cwd packages/backone --dry-run
          bun pm pack --cwd packages/backone-utils --dry-run
          bun pm pack --cwd packages/backone-cli --dry-run
